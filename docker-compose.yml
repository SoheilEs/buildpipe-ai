services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  nats:
    image: nats:2-alpine
    command: ['-js', '-m', '8222']
    ports:
      - '4222:4222'
      - '8222:8222'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:8222/healthz']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/buildpipe.db
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
      NODE_ENV: production
    volumes:
      - buildpipe_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: file:/app/data/buildpipe.db
      REDIS_HOST: redis
      NATS_URL: nats://nats:4222
      API_INTERNAL_URL: http://api:3000
      NODE_ENV: production
    volumes:
      - buildpipe_data:/app/data
    depends_on:
      api:
        condition: service_started
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  ai-engine:
    build:
      context: .
      dockerfile: infrastructure/docker/ai-engine.Dockerfile
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      AI_ENGINE_PORT: 3001
      NODE_ENV: production
    depends_on:
      - api
    restart: unless-stopped

volumes:
  redis_data:
  buildpipe_data:
