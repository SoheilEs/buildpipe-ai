name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: jobs only read the repository. Grant more per job if ever needed.
permissions:
  contents: read

# One run per PR/branch; superseded PR runs are cancelled, main runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: '1'
  CHECKPOINT_DISABLE: '1' # Prisma telemetry/update check

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Third-party actions are pinned to full commit SHAs; the comment names the release.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Toolchain versions
        run: |
          node --version
          npm --version

      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Build all workspaces
        run: npm run build

      - name: Typecheck (includes spec files)
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: End-to-end smoke tests
        run: npm run test:e2e

  static-checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Go and shellcheck ship on the runner image, so no third-party action is needed.
      # The module is fetched through the Go checksum database.
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color

  migrations:
    name: Migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Real PostgreSQL, same major version as docker-compose.yml. The credentials only exist
    # for this throwaway service container; they protect nothing.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-throwaway-password
          POSTGRES_DB: infralark_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d infralark_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CHECKPOINT_DISABLE: '1'
      DATABASE_URL: postgresql://ci:ci-only-throwaway-password@localhost:5432/infralark_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (lockfile only)
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Apply migrations to an empty database
        run: npx --no-install prisma migrate deploy

      # Fails (exit 2) when schema.prisma has changes that no migration covers.
      - name: Schema drift check
        run: npx --no-install prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      # The DB tests import code that depends on the shared-types workspace, which has to be built.
      - name: Build shared types
        run: npm run build -w @buildpipe/shared-types

      - name: Service registry and request tests on PostgreSQL
        run: npm run test:db -w @buildpipe/api

      - name: Seed runs on PostgreSQL (twice, must be idempotent)
        env:
          ADMIN_EMAIL: ci-admin@example.test
          ADMIN_PASSWORD: ci-only-seed-password-0001
        run: |
          npx --no-install tsx prisma/seed.ts
          npx --no-install tsx prisma/seed.ts
